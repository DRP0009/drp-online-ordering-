<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRP | Staff Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#160b20;
  --card:#281435;
  --purple:#7139a0;
  --light:#b98add;
  --white:#fff;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--white);
}
header {
  background:linear-gradient(120deg,#301044,#7139a0);
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
header h1 {margin:0;font-size:23px}
header p {margin:6px 0 0;color:#e4c9f5}
button,select,input {
  font:inherit;
  border:0;
  border-radius:10px;
  padding:12px;
}
button {
  cursor:pointer;
  background:var(--purple);
  color:white;
  font-weight:bold;
}
button:disabled {opacity:.5;cursor:not-allowed}
.secondary {background:#493057}
.accept-btn {
  background:#168653;
  min-width:130px;
}
main {max-width:1050px;margin:25px auto;padding:0 15px}
.panel,.order {
  background:var(--card);
  border:1px solid #503060;
  border-radius:17px;
  padding:20px;
  margin-bottom:16px;
}
input {
  display:block;
  width:100%;
  margin:12px 0;
  background:#160b20;
  color:white;
  border:1px solid #68447c;
}
.login {max-width:420px;margin:70px auto}
.login h2 {margin-top:0}
.muted {color:#c9b5d4}
.error {color:#ff9696;margin-top:12px}
.hidden {display:none!important}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}
.stat {
  background:#281435;
  padding:18px;
  border-radius:14px;
  border:1px solid #503060;
}
.stat strong {
  display:block;
  font-size:26px;
  color:#d5a9f4;
  margin-top:8px;
}
.order-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.order h3 {margin:0 0 10px}
.order-details {line-height:1.9;color:#e6d9ed}
.items {
  background:#1d1027;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  line-height:1.9;
}
.item-line {
  padding:9px 0;
  border-bottom:1px solid #493057;
}
.item-line:last-child {border-bottom:0}
.milk-info {
  color:#d5a9f4;
  font-size:14px;
  margin-top:3px;
}
.item-price {
  color:#fff;
  font-weight:bold;
}
.status {
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  background:#59406a;
  font-size:13px;
}
.status.pending {background:#79521b}
.status.preparing {background:#4c448c}
.status.ready {background:#246d55}
.status.completed {background:#4b5962}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.actions select {
  background:#160b20;
  color:white;
  border:1px solid #68447c;
  flex:1;
  min-width:150px;
}
#message {margin:10px 0}

/* شاشة تفعيل الصوت */
#audioGate {
  position:fixed;
  inset:0;
  z-index:99999;
  background:rgba(22,11,32,.97);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  cursor:pointer;
  touch-action:manipulation;
}
.audio-content {
  max-width:380px;
  background:#281435;
  border:1px solid #7139a0;
  border-radius:20px;
  padding:30px 22px;
}
.audio-icon {font-size:55px}

@media(max-width:550px) {
  .stats {grid-template-columns:1fr}
  header {align-items:flex-start}
}
</style>
</head>

<body>

<div id="audioGate" class="hidden">
  <div class="audio-content">
    <div class="audio-icon">🔔</div>
    <h2>DRP COFFEE</h2>
    <p style="color:#e4c9f5;line-height:1.8">
      اضغط بأي مكان لتشغيل تنبيهات الطلبات
    </p>
    <p style="font-size:13px;color:#b98add">
      لمسة واحدة فقط
    </p>
  </div>
</div>

<header>
  <div>
    <h1>DRP COFFEE ☕</h1>
    <p>STAFF ORDER DASHBOARD</p>
  </div>
  <button id="logoutBtn" class="secondary hidden">
    تسجيل الخروج
  </button>
</header>

<main>

  <section id="loginSection" class="panel login">
    <h2>تسجيل دخول الموظفين</h2>
    <p class="muted">لوحة إدارة طلبات DRP</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="البريد الإلكتروني" required>

      <input id="password" type="password"
        placeholder="كلمة المرور" required>

      <button type="submit" style="width:100%">
        دخول
      </button>
    </form>

    <p id="loginError" class="error"></p>
  </section>

  <section id="dashboard" class="hidden">

    <div class="panel">
      <div class="order-top">
        <div>
          <h2 style="margin:0">الطلبات</h2>
          <p class="muted">تصل الطلبات الجديدة تلقائياً</p>
        </div>

        <div class="actions">
          <button id="refreshBtn" class="secondary">
            تحديث
          </button>
        </div>
      </div>

      <p id="message" class="muted"></p>
    </div>

    <div class="stats">
      <div class="stat">
        طلبات جديدة
        <strong id="newCount">0</strong>
      </div>

      <div class="stat">
        قيد التحضير
        <strong id="prepCount">0</strong>
      </div>

      <div class="stat">
        جاهزة
        <strong id="readyCount">0</strong>
      </div>
    </div>

    <div id="ordersList"></div>

  </section>
</main>

<script>
const SUPABASE_URL =
  "https://oceudcjqwsfdqzvhyhlp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Q92rxmE2bYTTvvbpYU5ifg_BXN1bxOK";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let orders = [];
let channel = null;

let soundEnabled = false;
let audioContext = null;
let ringingInterval = null;
let isRinging = false;

let pendingOrderIds = new Set();
let activeOscillators = new Set();

const statuses = {
  pending: "جديد",
  preparing: "قيد التحضير",
  ready: "جاهز",
  completed: "مكتمل"
};

/* واجهة الدخول والرسائل */

function showMessage(message, error=false) {
  $("message").textContent = message;
  $("message").className = error ? "error" : "muted";
}

function showLogin() {
  $("loginSection").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("audioGate").classList.add("hidden");
}

function showDashboard() {
  $("loginSection").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
}

/* التحقق من صلاحية الموظف */

async function checkAdmin() {
  const {data:{user}} = await db.auth.getUser();

  if (!user) {
    showLogin();
    return false;
  }

  const {data,error} = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if (error || !data) {
    await db.auth.signOut();
    showLogin();

    $("loginError").textContent =
      "هذا الحساب غير مصرح له بدخول لوحة الإدارة.";

    return false;
  }

  return true;
}

/* تسجيل الدخول */

$("loginForm").addEventListener("submit",async e => {
  e.preventDefault();

  $("loginError").textContent =
    "جاري تسجيل الدخول...";

  const {error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  if (error) {
    $("loginError").textContent =
      "تعذر تسجيل الدخول: " + error.message;
    return;
  }

  await startDashboard();
});

/* تسجيل الخروج */

$("logoutBtn").addEventListener("click",async () => {
  stopRinging();

  if (channel) {
    await db.removeChannel(channel);
  }

  channel = null;
  orders = [];
  pendingOrderIds.clear();

  await db.auth.signOut();
  showLogin();
});

/* بدء لوحة الموظفين */

async function startDashboard() {
  const allowed = await checkAdmin();

  if (!allowed) return;

  showDashboard();

  setupAudioForDashboard();

  await loadOrders(true);
  subscribeToOrders();
}

/* تحميل الطلبات */

async function loadOrders(initial=false) {
  showMessage("جاري تحميل الطلبات...");

  const {data,error} = await db
    .from("orders")
    .select(`
      id,
      customer_name,
      customer_phone,
      branch,
      total,
      status,
      created_at,
      order_items (
        product_name,
        quantity,
        unit_price,
        milk_type
      )
    `)
    .order("created_at",{ascending:false});

  if (error) {
    showMessage(
      "خطأ في تحميل الطلبات: " + error.message,
      true
    );
    return;
  }

  orders = data || [];

  syncPendingOrders();
  renderOrders();

  showMessage("تم تحميل الطلبات بنجاح");
}

/* تحديد الطلبات الجديدة */

function syncPendingOrders() {
  pendingOrderIds = new Set(
    orders
      .filter(order => order.status === "pending")
      .map(order => order.id)
  );

  if (pendingOrderIds.size > 0) {
    startRinging();
  } else {
    stopRinging();
  }
}

/* عرض الطلبات */

function renderOrders() {
  $("newCount").textContent =
    orders.filter(o => o.status === "pending").length;

  $("prepCount").textContent =
    orders.filter(o => o.status === "preparing").length;

  $("readyCount").textContent =
    orders.filter(o => o.status === "ready").length;

  const list = $("ordersList");

  if (!orders.length) {
    list.innerHTML =
      '<div class="panel muted">لا توجد طلبات حتى الآن ☕</div>';
    return;
  }

  list.innerHTML = orders.map(order => {
    const items = order.order_items || [];

    const date = new Date(
      order.created_at
    ).toLocaleString("ar-JO");

    return `
      <article class="order">

        <div class="order-top">
          <h3>
            طلب #${escapeHTML(String(order.id).slice(0,8))}
          </h3>

          <span class="status ${escapeHTML(order.status)}">
            ${statuses[order.status] || escapeHTML(order.status)}
          </span>
        </div>

        <div class="order-details">
          <div>👤 الزبون: ${escapeHTML(order.customer_name)}</div>
          <div>📞 الهاتف: ${escapeHTML(order.customer_phone)}</div>
          <div>📍 الفرع: ${escapeHTML(order.branch)}</div>
          <div>🕒 ${escapeHTML(date)}</div>
        </div>

        <div class="items">
          <strong>تفاصيل الطلب:</strong>

          ${items.map(item => {
            const milk =
              item.milk_type && item.milk_type.trim()
              ? item.milk_type
              : "غير محدد";

            return `
              <div class="item-line">
                <strong>
                  ${escapeHTML(item.product_name)}
                  × ${Number(item.quantity)}
                </strong>

                <div class="milk-info">
                  🥛 نوع الحليب: ${escapeHTML(milk)}
                </div>

                <div class="item-price">
                  السعر:
                  ${(Number(item.unit_price) *
                    Number(item.quantity)).toFixed(2)}
                  JD
                </div>
              </div>
            `;
          }).join("")}
        </div>

        <h3>
          المجموع: ${Number(order.total).toFixed(2)} JD
        </h3>

        <div class="actions">
          ${
            order.status === "pending"
            ? `
              <button
                class="accept-btn"
                onclick="acceptOrder('${order.id}')"
              >
                ✓ قبول الطلب
              </button>
            `
            : `
              <select id="status-${order.id}">
                ${Object.entries(statuses).map(([key,label]) =>
                  `<option value="${key}"
                    ${order.status === key ? "selected" : ""}>
                    ${label}
                  </option>`
                ).join("")}
              </select>

              <button onclick="updateStatus('${order.id}')">
                حفظ الحالة
              </button>
            `
          }
        </div>

      </article>
    `;
  }).join("");
}

/* حماية النصوص */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g,char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

/* قبول الطلب */

async function acceptOrder(id) {
  const button = document.querySelector(
    `button[onclick="acceptOrder('${id}')"]`
  );

  if (button) {
    button.disabled = true;
    button.textContent = "جاري القبول...";
  }

  const {error} = await db
    .from("orders")
    .update({status:"preparing"})
    .eq("id",id)
    .eq("status","pending");

  if (error) {
    alert("تعذر قبول الطلب: " + error.message);

    if (button) {
      button.disabled = false;
      button.textContent = "✓ قبول الطلب";
    }

    return;
  }

  await loadOrders();
  showMessage("تم قبول الطلب بنجاح ✓");
}

window.acceptOrder = acceptOrder;

/* تحديث حالة الطلب */

async function updateStatus(id) {
  const select = $("status-" + id);

  if (!select) return;

  const status = select.value;

  const {error} = await db
    .from("orders")
    .update({status})
    .eq("id",id);

  if (error) {
    alert("تعذر تحديث الحالة: " + error.message);
    return;
  }

  await loadOrders();
  showMessage("تم تحديث حالة الطلب ✓");
}

window.updateStatus = updateStatus;

/* استقبال الطلبات والتحديثات المباشرة */

function subscribeToOrders() {
  if (channel) {
    db.removeChannel(channel);
  }

  channel = db
    .channel("drp-live-orders")

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"orders"
      },
      async payload => {
        showMessage("🔔 وصل طلب جديد!");

        if (
          payload.new?.id &&
          payload.new.status === "pending"
        ) {
          pendingOrderIds.add(payload.new.id);
          startRinging();
        }

        await loadOrders();
      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"orders"
      },
      async payload => {
        await loadOrders();
      }
    )

    .subscribe(status => {
      if (status === "SUBSCRIBED") {
        showMessage(
          "متصل مباشرة — بانتظار الطلبات الجديدة"
        );
      }

      if (status === "CHANNEL_ERROR") {
        showMessage(
          "تعذر الاتصال المباشر. جرّب تحديث الصفحة.",
          true
        );
      }
    });
}

/* -------------------------
   نظام الصوت الجديد
------------------------- */

function createAudioContext() {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) {
    return null;
  }

  if (!audioContext) {
    audioContext = new AudioContextClass();
  }

  return audioContext;
}

/* عند فتح لوحة الموظفين */
function setupAudioForDashboard() {
  const context = createAudioContext();

  if (!context) {
    showMessage("هذا المتصفح لا يدعم تشغيل التنبيهات الصوتية.",true);
    return;
  }

  if (context.state === "running") {
    soundEnabled = true;
    $("audioGate").classList.add("hidden");
  } else {
    soundEnabled = false;
    $("audioGate").classList.remove("hidden");
  }
}

/*
  مهم:
  يتم استدعاء resume وتشغيل الموجة
  مباشرة داخل لمسة المستخدم، وليس بعد انتظار.
*/
function unlockAudio(event) {
  if (event) {
    event.preventDefault();
  }

  const context = createAudioContext();

  if (!context) {
    showMessage("تعذر إنشاء نظام الصوت في هذا المتصفح.",true);
    return;
  }

  try {
    const oscillator = context.createOscillator();
    const gain = context.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;

    gain.gain.value = 0.18;

    oscillator.connect(gain);
    gain.connect(context.destination);

    oscillator.start();
    oscillator.stop(context.currentTime + 0.22);

    /*
      استدعاء resume مباشرة من حدث اللمس
      حتى يسمح Safari بتشغيل الصوت.
    */
    const resumePromise = context.resume();

    resumePromise.then(() => {
      if (context.state === "running") {
        soundEnabled = true;

        $("audioGate").classList.add("hidden");

        showMessage("تم تشغيل الصوت بنجاح ✓");

        if (pendingOrderIds.size > 0) {
          startRinging();
        }
      } else {
        soundEnabled = false;
        $("audioGate").classList.remove("hidden");
        showMessage("لم يتم تفعيل الصوت. اضغط مرة أخرى.",true);
      }
    }).catch(error => {
      console.log("Audio resume error:",error);

      soundEnabled = false;
      $("audioGate").classList.remove("hidden");

      showMessage("تعذر تشغيل الصوت. حاول الضغط مرة أخرى.",true);
    });

  } catch (error) {
    console.log("Audio unlock error:",error);
    $("audioGate").classList.remove("hidden");
  }
}

/* اللمس على أي مكان في الشاشة البنفسجية */
$("audioGate").addEventListener(
  "pointerdown",
  unlockAudio
);

/* نغمة التنبيه */

function playAlert() {
  if (!soundEnabled || !audioContext) return;

  if (audioContext.state !== "running") {
    soundEnabled = false;
    $("audioGate").classList.remove("hidden");
    return;
  }

  const start = audioContext.currentTime;

  const pattern = [
    {time:0,freq:1100},
    {time:0.65,freq:1450},
    {time:1.3,freq:1100},
    {time:1.95,freq:1450},
    {time:3,freq:1100},
    {time:3.65,freq:1450},
    {time:4.3,freq:1100},
    {time:4.95,freq:1450},
    {time:6,freq:1100},
    {time:6.65,freq:1450},
    {time:7.3,freq:1100}
  ];

  pattern.forEach(note => {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sawtooth";

    oscillator.frequency.setValueAtTime(
      note.freq,
      start + note.time
    );

    gain.gain.setValueAtTime(
      0.001,
      start + note.time
    );

    gain.gain.linearRampToValueAtTime(
      0.8,
      start + note.time + 0.04
    );

    gain.gain.setValueAtTime(
      0.8,
      start + note.time + 0.38
    );

    gain.gain.linearRampToValueAtTime(
      0.001,
      start + note.time + 0.48
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    activeOscillators.add(oscillator);

    oscillator.onended = () => {
      activeOscillators.delete(oscillator);
      oscillator.disconnect();
      gain.disconnect();
    };

    oscillator.start(start + note.time);
    oscillator.stop(start + note.time + 0.5);
  });
}

/* إيقاف الأصوات الحالية */

function stopCurrentSounds() {
  activeOscillators.forEach(oscillator => {
    try {
      oscillator.stop();
    } catch (error) {}
  });

  activeOscillators.clear();
}

/* استمرار الرنين حتى قبول جميع الطلبات */

function startRinging() {
  if (!soundEnabled || !audioContext) return;

  if (pendingOrderIds.size === 0 || isRinging) {
    return;
  }

  isRinging = true;

  playAlert();

  ringingInterval = setInterval(() => {
    if (
      !soundEnabled ||
      !audioContext ||
      audioContext.state !== "running" ||
      pendingOrderIds.size === 0
    ) {
      stopRinging();
      return;
    }

    playAlert();

  },8000);
}

function stopRinging() {
  isRinging = false;

  if (ringingInterval) {
    clearInterval(ringingInterval);
    ringingInterval = null;
  }

  stopCurrentSounds();
}

/* محاولة استعادة الصوت عند الرجوع إلى الصفحة */
document.addEventListener("visibilitychange",() => {
  if (
    document.visibilityState === "visible" &&
    audioContext &&
    audioContext.state === "running"
  ) {
    soundEnabled = true;

    if (pendingOrderIds.size > 0) {
      startRinging();
    }
  }
});

/* تحديث يدوي */

$("refreshBtn").addEventListener(
  "click",
  () => loadOrders()
);

/* بدء الموقع */

(async function init() {
  const {data:{session}} = await db.auth.getSession();

  if (session) {
    await startDashboard();
  } else {
    showLogin();
  }
})();
</script>

</body>
</html>
