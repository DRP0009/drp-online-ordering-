<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRP Coffee | Order Online</title>
<style>
:root{--deep:#301044;--purple:#552080;--light:#7139a0;--bg:#f7f3fa;--ink:#24152d;--muted:#766b7d;--white:#fff;--line:#eadff0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--deep),var(--light));color:#fff;padding:24px 18px 28px}
.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:28px;font-weight:900;letter-spacing:2px}.sub{opacity:.85;font-size:12px;letter-spacing:2px;margin-top:4px}
button,select,input,textarea{font:inherit}.lang{border:1px solid #ffffff70;background:#ffffff18;color:#fff;padding:9px 13px;border-radius:20px;cursor:pointer}
.hero{padding:24px 0 4px}.hero h1{font-size:clamp(25px,5vw,42px);margin:0 0 8px}.hero p{margin:0;opacity:.9}
main{max-width:1100px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.toolbar input{flex:1}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--purple);border-radius:22px;padding:9px 14px;cursor:pointer}.cat.active{background:var(--purple);color:#fff}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:82px}.pname{font-weight:700}.price{color:var(--purple);font-weight:800;margin-top:6px}.add{background:var(--purple);color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;min-width:40px}.cart{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;height:max-content;position:sticky;top:14px}.cart h2{margin:0 0 14px;font-size:21px}.empty{color:var(--muted);font-size:14px;padding:18px 0}.cartitem{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);padding:11px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:#fff;border-radius:8px;width:27px;height:27px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:16px 0}.fields{display:grid;gap:9px}.fields input,.fields textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.checkout{width:100%;border:0;background:linear-gradient(135deg,var(--purple),var(--light));color:#fff;padding:13px;border-radius:12px;font-weight:800;cursor:pointer}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
footer{text-align:center;color:var(--muted);padding:24px;font-size:12px}
@media(max-width:800px){main{grid-template-columns:1fr}.cart{position:static;grid-row:1}.products{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.products{grid-template-columns:1fr}.brand{font-size:24px}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><div><div class="brand">DRP COFFEE</div><div class="sub">COFFEE BAR · ORDER ONLINE</div></div><button class="lang" id="langBtn">English</button></div>
 <div class="hero"><h1 id="heroTitle">اطلب قهوتك المفضلة</h1><p id="heroSub">اختار من المنيو، أضف للسلة، وجهّز طلبك بسهولة.</p></div>
</div></header>
<main>
<section>
 <div class="toolbar"><input id="search" placeholder="ابحث عن مشروب..." aria-label="Search"><select id="sort"><option value="default">ترتيب المنيو</option><option value="low">السعر: الأقل أولاً</option><option value="high">السعر: الأعلى أولاً</option></select></div>
 <div class="cats" id="cats"></div><div class="products" id="products"></div>
</section>
<aside class="cart">
 <h2 id="cartTitle">سلة الطلبات</h2><div id="cartItems"></div>
 <div class="total"><span id="totalLabel">المجموع</span><span id="total">0.00 JD</span></div>
 <div class="fields"><input id="customer" placeholder="الاسم"><input id="phone" placeholder="رقم الهاتف" inputmode="tel"><textarea id="address" rows="2" placeholder="العنوان / ملاحظات التوصيل"></textarea></div>
 <button class="checkout" id="checkout">تجهيز الطلب</button>
 <div class="note" id="note">هذا نموذج أولي: زر تجهيز الطلب ينسخ ملخص الطلب فقط، ولا يرسل الطلب إلى المحل تلقائياً.</div>
</aside>
</main>
<footer>DRP COFFEE · JOD</footer>
<script>
const items=[
["Strawberry Refresher","ستروبيري ريفريشر",2.50,"Cold Drinks"],["Peach Refresher","بيتش ريفريشر",2.50,"Cold Drinks"],["Strawberry Smoothie","سموذي فراولة",3,"Smoothies"],["Passion Fruit Smoothie","سموذي باشن فروت",3,"Smoothies"],["Mango Smoothie","سموذي مانجا",3,"Smoothies"],["Blue Curacao","بلو كوراكاو",2.50,"Cold Drinks"],["Mojito Red Bull","موهيتو ريد بول",3.50,"Cold Drinks"],["Iced Tea","آيس تي",2,"Cold Drinks"],["Matcha Latte","ماتشا لاتيه",3,"Cold Drinks"],["Strawberry Matcha","ستروبيري ماتشا",3.50,"Cold Drinks"],["Strawberry Lemonade","ليمونادة فراولة",2.25,"Cold Drinks"],["Mango Matcha","مانجا ماتشا",3.50,"Cold Drinks"],["Watermelon","بطيخ",2,"Cold Drinks"],["Iced Chocolate","آيس شوكولاتة",2.50,"Cold Drinks"],["Crunch Cookies","كرنش كوكيز",2.75,"Desserts"],["Choco Ferrero","تشوكو فيريرو",3.50,"Desserts"],["Lazez Kinder","ليزيز كيندر",2.75,"Desserts"],["Tiramisu","تيراميسو",2,"Desserts"],["Lazez Pistachio","ليزيز فستق",2.50,"Desserts"],["Lazez Strawberry","ليزيز فراولة",2.50,"Desserts"],["Lazez Blueberry","ليزيز بلو بيري",2.50,"Desserts"],["Lazez Lotus","ليزيز لوتس",2.50,"Desserts"],["Lazez Small","ليزيز صغير",3,"Desserts"],["Lazez Large","ليزيز كبير",5,"Desserts"],["Lazloz Strawberry","لزلوز فراولة",3,"Desserts"],["Lazloz Mango","لزلوز مانجا",3,"Desserts"],["Watermelon Crunch","ووترميلون كرنش",2,"Desserts"],
["V60","V60",3,"Coffee"],["Iced Americano","آيس أمريكانو",1.50,"Coffee"],["Milkshake Coffee","ميلك شيك قهوة",3.25,"Milkshakes"],["Milkshake Caramel","ميلك شيك كراميل",3.25,"Milkshakes"],["Iced Latte","آيس لاتيه",2,"Coffee"],["Spanish Latte","سبانيش لاتيه",2.25,"Coffee"],["Pistachio Latte","لاتيه فستق",2.25,"Coffee"],["Caramel Latte","كراميل لاتيه",2.25,"Coffee"],["Caramel Macchiato","كراميل ماكياتو",2.75,"Coffee"],["Dark Mocha","دارك موكا",2.75,"Coffee"],["White Mocha","وايت موكا",2.75,"Coffee"],["Matcha Frappe","ماتشا فرابيه",3,"Frappe"],["Frappe Vanilla","فرابيه فانيلا",3.50,"Frappe"],["Frappe Chocolate","فرابيه شوكولاتة",3.50,"Frappe"],["Frappe Caramel","فرابيه كراميل",3.50,"Frappe"],["Salted Caramel","سولتد كراميل",2.50,"Coffee"],
["Espresso","إسبريسو",1,"Hot Coffee"],["Turkish Coffee","قهوة تركية",1,"Hot Coffee"],["American","أمريكان",1.50,"Hot Coffee"],["Flat White","فلات وايت",2,"Hot Coffee"],["Americano","أمريكانو",1.50,"Hot Coffee"],["Cinnamon Spice Latte","سينامون سبايس لاتيه",2.50,"Hot Coffee"],["Coffee Latte","كافيه لاتيه",2,"Hot Coffee"],["Spanish Latte","سبانيش لاتيه",2.25,"Hot Coffee"],["Caramel Latte","كراميل لاتيه",2.25,"Hot Coffee"],["Dark Mocha","دارك موكا",2.75,"Hot Coffee"],["White Mocha","وايت موكا",2.75,"Hot Coffee"],["Cappuccino","كابتشينو",1.75,"Hot Coffee"],["V60","V60",3,"Hot Coffee"],["Hot Chocolate","هوت شوكولاتة",2,"Hot Coffee"],["Hot Choco Marshmallow","هوت شوكو مارشميلو",2.50,"Hot Coffee"],["Matcha Latte","ماتشا لاتيه",3,"Hot Coffee"],["Hot Pistachio","هوت فستق",2.25,"Hot Coffee"],["Hot Caramel Macchiato","هوت كراميل ماكياتو",2.75,"Hot Coffee"]
].map((x,i)=>({id:i,en:x[0],ar:x[1],price:x[2],cat:x[3]}));
let lang="ar", category="All", cart={};
const $=id=>document.getElementById(id), money=n=>n.toFixed(2)+" JD";
function t(ar,en){return lang==="ar"?ar:en}
function categories(){let cats=["All",...new Set(items.map(x=>x.cat))];$("cats").innerHTML=cats.map(c=>`<button class="cat ${category===c?"active":""}" data-cat="${c}">${c==="All"?t("الكل","All"):c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()})}
function renderProducts(){let q=$("search").value.trim().toLowerCase(),list=items.filter(p=>(category==="All"||p.cat===category)&&(!q||(p.en+" "+p.ar).toLowerCase().includes(q)));if($("sort").value==="low")list.sort((a,b)=>a.price-b.price);if($("sort").value==="high")list.sort((a,b)=>b.price-a.price);$("products").innerHTML=list.map(p=>`<article class="product"><div><div class="pname">${lang==="ar"?p.ar:p.en}</div><div class="price">${money(p.price)}</div></div><button class="add" data-add="${p.id}" aria-label="Add">+</button></article>`).join("")||`<p>${t("ما لقينا نتائج","No results found")}</p>`;document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;renderCart()})}
function renderCart(){let entries=Object.entries(cart).filter(([id,q])=>q>0);$("cartItems").innerHTML=entries.length?entries.map(([id,q])=>{let p=items[+id];return `<div class="cartitem"><div><b>${lang==="ar"?p.ar:p.en}</b><div class="price">${money(p.price*q)}</div></div><div class="qty"><button data-dec="${id}">−</button><span>${q}</span><button data-inc="${id}">+</button></div></div>`}).join(""):`<div class="empty">${t("السلة فارغة حالياً","Your cart is empty")}</div>`;document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{let id=b.dataset.dec;cart[id]--;if(cart[id]<=0)delete cart[id];renderCart()});document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{let id=b.dataset.inc;cart[id]++;renderCart()});let total=entries.reduce((s,[id,q])=>s+items[+id].price*q,0);$("total").textContent=money(total)}
function render(){categories();renderProducts();renderCart()}
function setLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("langBtn").textContent=lang==="ar"?"English":"العربية";$("heroTitle").textContent=t("اطلب قهوتك المفضلة","Order your favorite coffee");$("heroSub").textContent=t("اختار من المنيو، أضف للسلة، وجهّز طلبك بسهولة.","Choose from the menu, add to cart, and prepare your order.");$("cartTitle").textContent=t("سلة الطلبات","Your Cart");$("totalLabel").textContent=t("المجموع","Total");$("search").placeholder=t("ابحث عن مشروب...","Search the menu...");$("customer").placeholder=t("الاسم","Name");$("phone").placeholder=t("رقم الهاتف","Phone number");$("address").placeholder=t("العنوان / ملاحظات التوصيل","Address / delivery notes");$("checkout").textContent=t("تجهيز الطلب","Prepare order");$("note").textContent=t("هذا نموذج أولي: زر تجهيز الطلب ينسخ ملخص الطلب فقط، ولا يرسل الطلب إلى المحل تلقائياً.","Prototype only: this button copies the order summary; it does not send the order to the shop.");render()}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";setLang()};$("search").oninput=renderProducts;$("sort").onchange=renderProducts;
$("checkout").onclick=async()=>{let entries=Object.entries(cart).filter(([id,q])=>q>0);if(!entries.length){alert(t("أضف منتجات للسلة أولاً","Add items to your cart first"));return}let total=entries.reduce((s,[id,q])=>s+items[+id].price*q,0);let lines=entries.map(([id,q])=>`${items[+id].en} x${q} — ${money(items[+id].price*q)}`);let msg=`DRP COFFEE ORDER\nName: ${$("customer").value}\nPhone: ${$("phone").value}\nAddress: ${$("address").value}\n\n${lines.join("\n")}\n\nTotal: ${money(total)}`;try{await navigator.clipboard.writeText(msg);alert(t("تم نسخ ملخص الطلب. أرسله للمحل لإتمام الطلب.","Order summary copied. Send it to the shop to complete your order."))}catch(e){prompt("Copy your order:",msg)}};
setLang();
</script>
</body></html>
