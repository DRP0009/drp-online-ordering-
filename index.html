<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRP Coffee | Order Online</title>
<style>
:root {
  --deep:#301044;
  --purple:#552080;
  --light:#7139a0;
  --bg:#f7f3fa;
  --ink:#24152d;
  --muted:#766b7d;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header {
  background:linear-gradient(135deg,var(--deep),var(--light));
  color:white;
  padding:22px 18px;
}
.wrap {max-width:1100px;margin:auto}
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand {font-size:30px;font-weight:900;letter-spacing:2px}
.sub {font-size:11px;letter-spacing:2px;opacity:.8}
button,input,select {font:inherit}
button {cursor:pointer}
.lang,.cartBtn {
  border:1px solid #ffffff70;
  background:#ffffff18;
  color:white;
  padding:10px 14px;
  border-radius:12px;
}
.hero {padding:28px 0 10px}
.hero h1 {font-size:35px;margin:0 0 8px}
.hero p {margin:0;opacity:.85}
main {
  max-width:1100px;
  margin:24px auto;
  padding:0 16px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:20px;
}
.toolbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
input {
  border:1px solid #eadff0;
  border-radius:12px;
  padding:12px;
  background:white;
  min-width:0;
}
#search {flex:1;min-width:150px}
.cats {
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:16px;
}
.cat {
  border:1px solid #eadff0;
  background:white;
  color:var(--purple);
  padding:10px 15px;
  border-radius:30px;
  white-space:nowrap;
}
.cat.active {background:var(--purple);color:white}
.products {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.product {
  background:white;
  padding:16px;
  border:1px solid #eadff0;
  border-radius:16px;
  box-shadow:0 5px 18px #3010440d;
}
.product h3 {font-size:16px;margin:0 0 10px}
.productBottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.price {color:var(--purple);font-weight:900}
.add {
  background:#f0e6f7;
  color:var(--purple);
  border:0;
  border-radius:10px;
  padding:9px 12px;
  font-weight:bold;
}
.add:hover {background:var(--purple);color:white}
.cart {
  background:white;
  border:1px solid #eadff0;
  border-radius:18px;
  padding:18px;
  height:max-content;
  position:sticky;
  top:15px;
}
.cart h2 {margin-top:0}
.cartItem {
  padding:12px 0;
  border-bottom:1px solid #eee5f3;
}
.cartLine {
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.qty {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.qty button {
  border:0;
  background:#f0e6f7;
  color:var(--purple);
  border-radius:7px;
  width:27px;
  height:27px;
}
.total {
  display:flex;
  justify-content:space-between;
  font-size:19px;
  font-weight:bold;
  color:var(--purple);
  margin-top:18px;
}
.checkout {
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(120deg,var(--deep),var(--light));
  font-weight:bold;
}
.empty {color:var(--muted);text-align:center;padding:20px}
footer {text-align:center;padding:25px;color:var(--muted);font-size:12px}
@media(max-width:750px) {
  main {grid-template-columns:1fr}
  .cart {position:static}
}
@media(max-width:420px) {
  .products {grid-template-columns:1fr}
  .hero h1 {font-size:27px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand">DRP</div>
        <div class="sub">COFFEE BAR · LOYALTY CLUB</div>
      </div>
      <div>
        <button class="lang" id="langBtn">EN</button>
      </div>
    </div>
    <div class="hero">
      <h1 id="heroTitle">اطلب قهوتك من DRP</h1>
      <p id="heroText">اختار مشروبك المفضل واستمتع بيومك ☕</p>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="toolbar">
      <input id="search" placeholder="ابحث عن مشروب...">
    </div>
    <div class="cats" id="cats"></div>
    <div class="products" id="products"></div>
  </section>

  <aside class="cart">
    <h2 id="cartTitle">سلة الطلب 🛒</h2>
    <div id="cartItems"></div>
    <div class="total">
      <span id="totalLabel">المجموع</span>
      <span id="total">0.00 JD</span>
    </div>
    <button class="checkout" id="checkout">متابعة الطلب</button>
  </aside>
</main>

<footer>DRP COFFEE · AMMAN, JORDAN</footer>

<script>
const items = [
{cat:"مشروبات باردة",name:"Strawberry Refresher",price:2.50},
{cat:"مشروبات باردة",name:"Peach Refresher",price:2.50},
{cat:"مشروبات باردة",name:"Strawberry Smoothie",price:3.00},
{cat:"مشروبات باردة",name:"Passion Fruit Smoothie",price:3.00},
{cat:"مشروبات باردة",name:"Mango Smoothie",price:3.00},
{cat:"مشروبات باردة",name:"Blue Curacao",price:2.50},
{cat:"مشروبات باردة",name:"Mojito Red Bull",price:3.50},
{cat:"مشروبات باردة",name:"Iced Tea",price:2.00},
{cat:"مشروبات باردة",name:"Matcha Latte",price:3.00},
{cat:"مشروبات باردة",name:"Strawberry Matcha",price:3.50},
{cat:"مشروبات باردة",name:"Strawberry Lemonade",price:2.25},
{cat:"مشروبات باردة",name:"Mango Matcha",price:3.50},
{cat:"مشروبات باردة",name:"Watermelon",price:2.00},
{cat:"مشروبات باردة",name:"Iced Chocolate",price:2.50},
{cat:"مشروبات باردة",name:"Crunch Cookies",price:2.75},
{cat:"مشروبات باردة",name:"Choco Ferrero",price:3.50},
{cat:"مشروبات باردة",name:"Lazez Kinder",price:2.75},
{cat:"مشروبات باردة",name:"Tiramisu",price:2.00},
{cat:"مشروبات باردة",name:"Lazez Pistachio",price:2.50},
{cat:"مشروبات باردة",name:"Lazez Strawberry",price:2.50},
{cat:"مشروبات باردة",name:"Lazez Blueberry",price:2.50},
{cat:"مشروبات باردة",name:"Lazez Lotus",price:2.50},
{cat:"مشروبات باردة",name:"Lazez Small",price:3.00},
{cat:"مشروبات باردة",name:"Lazez Large",price:5.00},
{cat:"مشروبات باردة",name:"Lazloz Strawberry",price:3.00},
{cat:"مشروبات باردة",name:"Lazloz Mango",price:3.00},
{cat:"مشروبات باردة",name:"Watermelon Crunch",price:2.00},

{cat:"قهوة باردة",name:"V60",price:3.00},
{cat:"قهوة باردة",name:"Iced Americano",price:1.50},
{cat:"قهوة باردة",name:"Milkshake Coffee",price:3.25},
{cat:"قهوة باردة",name:"Milkshake Caramel",price:3.25},
{cat:"قهوة باردة",name:"Iced Latte",price:2.00},
{cat:"قهوة باردة",name:"Spanish Latte",price:2.25},
{cat:"قهوة باردة",name:"Pistachio Latte",price:2.25},
{cat:"قهوة باردة",name:"Caramel Latte",price:2.25},
{cat:"قهوة باردة",name:"Caramel Macchiato",price:2.75},
{cat:"قهوة باردة",name:"Dark Mocha",price:2.75},
{cat:"قهوة باردة",name:"White Mocha",price:2.75},
{cat:"قهوة باردة",name:"Matcha Frappe",price:3.00},
{cat:"قهوة باردة",name:"Frappe Vanilla",price:3.50},
{cat:"قهوة باردة",name:"Frappe Chocolate",price:3.50},
{cat:"قهوة باردة",name:"Frappe Caramel",price:3.50},
{cat:"قهوة باردة",name:"Salted Caramel",price:2.50},

{cat:"قهوة ساخنة",name:"Espresso",price:1.00},
{cat:"قهوة ساخنة",name:"Turkish Coffee",price:1.00},
{cat:"قهوة ساخنة",name:"American",price:1.50},
{cat:"قهوة ساخنة",name:"Flat White",price:2.00},
{cat:"قهوة ساخنة",name:"Americano",price:1.50},
{cat:"قهوة ساخنة",name:"Cinnamon Spice Latte",price:2.50},
{cat:"قهوة ساخنة",name:"Coffee Latte",price:2.00},
{cat:"قهوة ساخنة",name:"Spanish Latte",price:2.25},
{cat:"قهوة ساخنة",name:"Caramel Latte",price:2.25},
{cat:"قهوة ساخنة",name:"Dark Mocha",price:2.75},
{cat:"قهوة ساخنة",name:"White Mocha",price:2.75},
{cat:"قهوة ساخنة",name:"Cappuccino",price:1.75},
{cat:"قهوة ساخنة",name:"V60",price:3.00},
{cat:"قهوة ساخنة",name:"Hot Chocolate",price:2.00},
{cat:"قهوة ساخنة",name:"Hot Choco Marshmallow",price:2.50},
{cat:"قهوة ساخنة",name:"Matcha Latte",price:3.00},
{cat:"قهوة ساخنة",name:"Hot Pistachio",price:2.25},
{cat:"قهوة ساخنة",name:"Hot Caramel Macchiato",price:2.75}
];

let lang="ar";
let category="الكل";
let cart={};

const $ = id => document.getElementById(id);
const money = n => n.toFixed(2)+" JD";
const t = (ar,en) => lang==="ar"?ar:en;

function renderCategories(){
  const cats=["الكل",...new Set(items.map(x=>x.cat))];
  $("cats").innerHTML=cats.map(c=>`
    <button class="cat ${category===c?"active":""}" data-cat="${c}">
      ${lang==="ar"?c:({
        "الكل":"All",
        "مشروبات باردة":"Cold Drinks",
        "قهوة باردة":"Iced Coffee",
        "قهوة ساخنة":"Hot Coffee"
      }[c])}
    </button>
  `).join("");
}

function renderProducts(){
  const q=$("search").value.trim().toLowerCase();
  const list=items.map((p,i)=>({...p,id:i})).filter(p=>
    (category==="الكل"||p.cat===category) &&
    p.name.toLowerCase().includes(q)
  );

  $("products").innerHTML=list.length?list.map(p=>`
    <article class="product">
      <h3>${p.name}</h3>
      <div class="productBottom">
        <span class="price">${money(p.price)}</span>
        <button class="add" data-add="${p.id}">${t("＋ أضف","＋ Add")}</button>
      </div>
    </article>
  `).join(""):`<div class="empty">${t("لا توجد نتائج","No results")}</div>`;
}

function renderCart(){
  const entries=Object.entries(cart).filter(([id,q])=>q>0);

  $("cartItems").innerHTML=entries.length?entries.map(([id,q])=>{
    const p=items[Number(id)];
    return `
      <div class="cartItem">
        <div class="cartLine">
          <strong>${p.name}</strong>
          <span>${money(p.price*q)}</span>
        </div>
        <div class="qty">
          <button data-dec="${id}">−</button>
          <b>${q}</b>
          <button data-inc="${id}">＋</button>
        </div>
      </div>
    `;
  }).join(""):`<div class="empty">${t("السلة فارغة","Your cart is empty")}</div>`;

  const total=entries.reduce((sum,[id,q])=>sum+items[Number(id)].price*q,0);
  $("total").textContent=money(total);
}

function render(){
  renderCategories();
  renderProducts();
  renderCart();
}

$("cats").addEventListener("click",e=>{
  const b=e.target.closest("[data-cat]");
  if(!b)return;
  category=b.dataset.cat;
  render();
});

$("products").addEventListener("click",e=>{
  const b=e.target.closest("[data-add]");
  if(!b)return;
  const id=b.dataset.add;
  cart[id]=(cart[id]||0)+1;
  renderCart();
});

$("cartItems").addEventListener("click",e=>{
  const inc=e.target.closest("[data-inc]");
  const dec=e.target.closest("[data-dec]");
  if(inc){
    const id=inc.dataset.inc;
    cart[id]=(cart[id]||0)+1;
  }
  if(dec){
    const id=dec.dataset.dec;
    cart[id]--;
    if(cart[id]<=0)delete cart[id];
  }
  renderCart();
});

$("search").addEventListener("input",renderProducts);

$("langBtn").onclick=()=>{
  lang=lang==="ar"?"en":"ar";
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("langBtn").textContent=lang==="ar"?"EN":"عربي";
  $("heroTitle").textContent=t("اطلب قهوتك من DRP","Order your coffee from DRP");
  $("heroText").textContent=t(
    "اختار مشروبك المفضل واستمتع بيومك ☕",
    "Choose your favorite drink and enjoy your day ☕"
  );
  $("cartTitle").textContent=t("سلة الطلب 🛒","Your Cart 🛒");
  $("totalLabel").textContent=t("المجموع","Total");
  $("checkout").textContent=t("متابعة الطلب","Continue Order");
  $("search").placeholder=t("ابحث عن مشروب...","Search drinks...");
  render();
};

$("checkout").onclick=()=>{
  const entries=Object.entries(cart).filter(([id,q])=>q>0);
  if(!entries.length){
    alert(t("السلة فارغة! أضف منتجات أولاً.","Your cart is empty!"));
    return;
  }
  const lines=entries.map(([id,q])=>
    `${items[Number(id)].name} × ${q}`
  ).join("\n");
  const total=entries.reduce((sum,[id,q])=>
    sum+items[Number(id)].price*q,0
  );
  alert(
    t("طلبك:\n","Your order:\n")+
    lines+"\n\n"+
    t("المجموع: ","Total: ")+money(total)
  );
};

render();
</script>
</body>
</html>
