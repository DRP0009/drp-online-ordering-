<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>DRP Coffee | Order Online</title>
<style>
:root {
  --bg:#160b20;
  --card:#281435;
  --purple:#7139a0;
  --light:#b98add;
  --white:#fff;
  --muted:#c4b5ce;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(145deg,#160b20,#301044);
  color:var(--white);
}
header{
  padding:25px 18px;
  text-align:center;
  background:linear-gradient(135deg,#301044,#7139a0);
  border-radius:0 0 28px 28px;
}
.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:3px;
}
header p{color:#eee;margin:8px 0}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  max-width:1000px;
  margin:auto;
}
button{
  border:0;
  cursor:pointer;
  font-weight:bold;
  border-radius:12px;
}
.lang{
  background:#fff;
  color:#301044;
  padding:10px 15px;
}
.search{
  display:block;
  width:calc(100% - 30px);
  max-width:970px;
  margin:5px auto 18px;
  padding:14px;
  border-radius:12px;
  border:1px solid #69447e;
  background:#281435;
  color:white;
  font-size:16px;
  outline:none;
}
.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:5px 15px 15px;
  max-width:1000px;
  margin:auto;
}
.cat{
  flex-shrink:0;
  padding:11px 17px;
  background:#281435;
  color:white;
}
.cat.active{background:#7139a0}
h2{
  max-width:970px;
  margin:20px auto 12px;
  padding:0 15px;
}
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:13px;
  max-width:1000px;
  padding:12px 15px;
  margin:auto;
}
.item{
  background:linear-gradient(145deg,#321b40,#24112f);
  border:1px solid #57366b;
  border-radius:17px;
  padding:16px 13px;
  display:flex;
  flex-direction:column;
  min-height:145px;
}
.item h3{font-size:15px;margin:0 0 10px}
.price{
  color:#d9b6f4;
  font-size:17px;
  font-weight:bold;
  margin-top:auto;
}
.add{
  background:#7139a0;
  color:white;
  padding:10px;
  margin-top:12px;
}
.add:active{transform:scale(.97)}
.cart{
  max-width:970px;
  margin:20px auto;
  padding:18px;
  background:#281435;
  border:1px solid #68447b;
  border-radius:18px;
}
.cart h2{margin:0 0 15px;padding:0}
.cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #493052;
}
.qty button{
  background:#7139a0;
  color:white;
  padding:5px 10px;
  margin:0 3px;
}
.total{
  font-size:21px;
  font-weight:bold;
  color:#d9b6f4;
  margin:18px 0;
}
.checkout{
  width:100%;
  background:#fff;
  color:#301044;
  padding:15px;
  font-size:16px;
}
.empty{text-align:center;color:#c4b5ce}
footer{
  text-align:center;
  padding:25px;
  color:#bda9c9;
  font-size:13px;
}
</style>
</head>
<body>

<header>
  <div class="logo">DRP</div>
  <p>COFFEE BAR · ORDER ONLINE</p>
  <p id="subtitle">اطلب قهوتك المفضلة</p>
</header>

<div class="top">
  <strong id="menuTitle">قائمة المشروبات</strong>
  <button class="lang" onclick="toggleLang()">EN / AR</button>
</div>

<input class="search" id="search" placeholder="ابحث عن منتج..." oninput="render()">

<div class="categories" id="categories"></div>

<div class="menu" id="menu"></div>

<div class="cart" id="cart">
  <h2 id="cartTitle">سلة الطلبات 🛒</h2>
  <div id="cartItems"></div>
  <div class="total" id="total">المجموع: 0.00 JD</div>
  <div style="margin-bottom:15px">
  <input id="customerName" placeholder="اسم الزبون"
    style="width:100%;padding:13px;margin-bottom:10px;border-radius:10px">

  <input id="customerPhone" placeholder="رقم الهاتف"
    type="tel"
    style="width:100%;padding:13px;margin-bottom:10px;border-radius:10px">

  <select id="branch"
    style="width:100%;padding:13px;border-radius:10px">
    <option value="">اختر الفرع</option>
    <option value="DRP شارع المدينة">DRP شارع المدينة</option>
    <option value="DRP شارع عبدالله غوشة">DRP شارع عبدالله غوشة</option>
  </select>
</div>
  <button class="checkout" onclick="checkout()" id="checkoutBtn">تأكيد الطلب</button>
</div>

<footer>DRP COFFEE · THANK YOU FOR CHOOSING US ☕</footer>

<script>
let lang = "ar";
let category = "All";
let cart = [];

const products = [
  {name:"Strawberry Refresher",price:2.50,cat:"Cold Drinks"},
  {name:"Peach Refresher",price:2.50,cat:"Cold Drinks"},
  {name:"Strawberry Smoothie",price:3.00,cat:"Cold Drinks"},
  {name:"Passion Fruit Smoothie",price:3.00,cat:"Cold Drinks"},
  {name:"Mango Smoothie",price:3.00,cat:"Cold Drinks"},
  {name:"Blue Curacao",price:2.50,cat:"Cold Drinks"},
  {name:"Mojito Red Bull",price:3.50,cat:"Cold Drinks"},
  {name:"Iced Tea",price:2.00,cat:"Cold Drinks"},
  {name:"Matcha Latte",price:3.00,cat:"Cold Drinks"},
  {name:"Strawberry Matcha",price:3.50,cat:"Cold Drinks"},
  {name:"Strawberry Lemonade",price:2.25,cat:"Cold Drinks"},
  {name:"Mango Matcha",price:3.50,cat:"Cold Drinks"},
  {name:"Watermelon",price:2.00,cat:"Cold Drinks"},
  {name:"Iced Chocolate",price:2.50,cat:"Cold Drinks"},

  {name:"Crunch Cookies",price:2.75,cat:"Desserts"},
  {name:"Choco Ferrero",price:3.50,cat:"Desserts"},
  {name:"Lazez Kinder",price:2.75,cat:"Desserts"},
  {name:"Tiramisu",price:2.00,cat:"Desserts"},
  {name:"Lazez Pistachio",price:2.50,cat:"Desserts"},
  {name:"Lazez Strawberry",price:2.50,cat:"Desserts"},
  {name:"Lazez Blueberry",price:2.50,cat:"Desserts"},
  {name:"Lazez Lotus",price:2.50,cat:"Desserts"},
  {name:"Lazez Small",price:3.00,cat:"Desserts"},
  {name:"Lazez Large",price:5.00,cat:"Desserts"},
  {name:"Lazloz Strawberry",price:3.00,cat:"Desserts"},
  {name:"Lazloz Mango",price:3.00,cat:"Desserts"},
  {name:"Watermelon Crunch",price:2.00,cat:"Desserts"},

  {name:"V60",price:3.00,cat:"Cold Coffee"},
  {name:"Iced Americano",price:1.50,cat:"Cold Coffee"},
  {name:"Milkshake Coffee",price:3.25,cat:"Cold Coffee"},
  {name:"Milkshake Caramel",price:3.25,cat:"Cold Coffee"},
  {name:"Iced Latte",price:2.00,cat:"Cold Coffee"},
  {name:"Spanish Latte",price:2.25,cat:"Cold Coffee"},
  {name:"Pistachio Latte",price:2.25,cat:"Cold Coffee"},
  {name:"Caramel Latte",price:2.25,cat:"Cold Coffee"},
  {name:"Caramel Macchiato",price:2.75,cat:"Cold Coffee"},
  {name:"Dark Mocha",price:2.75,cat:"Cold Coffee"},
  {name:"White Mocha",price:2.75,cat:"Cold Coffee"},
  {name:"Matcha Frappe",price:3.00,cat:"Cold Coffee"},
  {name:"Frappe Vanilla",price:3.50,cat:"Cold Coffee"},
  {name:"Frappe Chocolate",price:3.50,cat:"Cold Coffee"},
  {name:"Frappe Caramel",price:3.50,cat:"Cold Coffee"},
  {name:"Salted Caramel",price:2.50,cat:"Cold Coffee"},

  {name:"Espresso",price:1.00,cat:"Hot Coffee"},
  {name:"Turkish Coffee",price:1.00,cat:"Hot Coffee"},
  {name:"American",price:1.50,cat:"Hot Coffee"},
  {name:"Flat White",price:2.00,cat:"Hot Coffee"},
  {name:"Americano",price:1.50,cat:"Hot Coffee"},
  {name:"Cinnamon Spice Latte",price:2.50,cat:"Hot Coffee"},
  {name:"Coffee Latte",price:2.00,cat:"Hot Coffee"},
  {name:"Spanish Latte",price:2.25,cat:"Hot Coffee"},
  {name:"Caramel Latte",price:2.25,cat:"Hot Coffee"},
  {name:"Dark Mocha",price:2.75,cat:"Hot Coffee"},
  {name:"White Mocha",price:2.75,cat:"Hot Coffee"},
  {name:"Cappuccino",price:1.75,cat:"Hot Coffee"},
  {name:"V60",price:3.00,cat:"Hot Coffee"},
  {name:"Hot Chocolate",price:2.00,cat:"Hot Coffee"},
  {name:"Hot Choco Marshmallow",price:2.50,cat:"Hot Coffee"},
  {name:"Matcha Latte",price:3.00,cat:"Hot Coffee"},
  {name:"Hot Pistachio",price:2.25,cat:"Hot Coffee"},
  {name:"Hot Caramel Macchiato",price:2.75,cat:"Hot Coffee"}
];

const categories = ["All","Cold Drinks","Cold Coffee","Hot Coffee","Desserts"];

function tr(ar,en){return lang==="ar"?ar:en}
function money(n){return n.toFixed(2)+" JD"}

function renderCategories(){
  document.getElementById("categories").innerHTML=categories.map(c=>
    `<button class="cat ${category===c?'active':''}" onclick="setCategory('${c}')">${categoryName(c)}</button>`
  ).join("");
}

function categoryName(c){
  if(lang==="en") return c==="All"?"All":c;
  return {
    "All":"الكل",
    "Cold Drinks":"مشروبات باردة",
    "Cold Coffee":"قهوة باردة",
    "Hot Coffee":"قهوة ساخنة",
    "Desserts":"حلويات"
  }[c];
}

function setCategory(c){
  category=c;
  render();
}

function render(){
  renderCategories();
  const search=document.getElementById("search").value.toLowerCase();
  const filtered=products.filter(p=>
    (category==="All"||p.cat===category) &&
    p.name.toLowerCase().includes(search)
  );

  document.getElementById("menu").innerHTML=filtered.map(p=>{
    const i=products.indexOf(p);
    return `<div class="item">
      <h3>${p.name}</h3>
      <div class="price">${money(p.price)}</div>
      <button class="add" onclick="addToCart(${i})">${tr("أضف للسلة +","Add to cart +")}</button>
    </div>`;
  }).join("");
  renderCart();
}

function addToCart(i){
  const found=cart.find(x=>x.id===i);
  if(found) found.qty++;
  else cart.push({id:i,qty:1});
  renderCart();
}

function changeQty(i,n){
  const item=cart.find(x=>x.id===i);
  if(!item)return;
  item.qty+=n;
  if(item.qty<=0)cart=cart.filter(x=>x.id!==i);
  renderCart();
}

function renderCart(){
  const box=document.getElementById("cartItems");
  if(cart.length===0){
    box.innerHTML=`<p class="empty">${tr("السلة فارغة حالياً","Your cart is empty")}</p>`;
  }else{
    box.innerHTML=cart.map(x=>{
      const p=products[x.id];
      return `<div class="cart-row">
        <div>${p.name}<br><small>${money(p.price*x.qty)}</small></div>
        <div class="qty">
          <button onclick="changeQty(${x.id},-1)">−</button>
          ${x.qty}
          <button onclick="changeQty(${x.id},1)">+</button>
        </div>
      </div>`;
    }).join("");
  }
  const total=cart.reduce((s,x)=>s+products[x.id].price*x.qty,0);
  document.getElementById("total").textContent=
    tr("المجموع: ","Total: ")+money(total);
}

function toggleLang(){
  lang=lang==="ar"?"en":"ar";
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.getElementById("subtitle").textContent=
    tr("اطلب قهوتك المفضلة","ORDER YOUR FAVORITE COFFEE");
  document.getElementById("menuTitle").textContent=
    tr("قائمة المشروبات","OUR MENU");
  document.getElementById("cartTitle").textContent=
    tr("سلة الطلبات 🛒","YOUR CART 🛒");
  document.getElementById("checkoutBtn").textContent=
    tr("تأكيد الطلب","Confirm Order");
  document.getElementById("search").placeholder=
    tr("ابحث عن منتج...","Search products...");
  render();
}

async function checkout(){
  if(cart.length===0){
    alert(tr("السلة فارغة!","Your cart is empty!"));
    return;
  }

  const customerName = document.getElementById("customerName").value.trim();
  const customerPhone = document.getElementById("customerPhone").value.trim();
  const branch = document.getElementById("branch").value;

  if(!customerName || !customerPhone || !branch){
    alert(tr("يرجى تعبئة جميع البيانات واختيار الفرع","Please fill all details and select a branch"));
    return;
  }

  const items = cart.map(x => ({
    name: products[x.id].name,
    quantity: x.qty
  }));

  const btn = document.getElementById("checkoutBtn");
  btn.disabled = true;
  btn.textContent = tr("جاري إرسال الطلب...","Sending order...");

  try {
    const response = await fetch(
      "https://oceudcjqwsfdqzvhyhlp.supabase.co/functions/v1/drp-create-order",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "sb_publishable_Q92rxmE2bYTTvvbpYU5ifg_BXN1bxOK"
        },
        body: JSON.stringify({
          customer_name: customerName,
          customer_phone: customerPhone,
          branch: branch,
          items: items
        })
      }
    );

    const result = await response.json();

    if(!response.ok || !result.success){
      throw new Error(result.error || "Order failed");
    }

    alert(
      tr("تم استلام طلبك بنجاح ❤️\nرقم الطلب: ","Your order was received ❤️\nOrder number: ")
      + result.order_id
      + "\n"
      + tr("المجموع: ","Total: ")
      + money(result.total)
    );

    cart = [];
    renderCart();

    document.getElementById("customerName").value = "";
    document.getElementById("customerPhone").value = "";
    document.getElementById("branch").value = "";

  } catch(error) {
    console.error(error);
    alert(tr("لم نتمكن من إرسال الطلب. حاول مرة أخرى.","Could not send order. Please try again."));
  } finally {
    btn.disabled = false;
    btn.textContent = tr("تأكيد الطلب","Confirm Order");
  }
}

render();
</script>
</body>
</html>
